name: release

# Publishes to PyPI when a version tag (v*.*.*) is pushed. Uses PyPI trusted
# publishing (OIDC): configure the "pypi" environment and a trusted publisher
# for this repository on pypi.org first. See CONTRIBUTING.md#releasing.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import re;print(re.search(r'\"(.+)\"', open('src/blitzq/_version.py').read()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || (echo "tag ${GITHUB_REF_NAME} != v$version" && exit 1)
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
