name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests benchmarks examples
      - run: ruff check src tests benchmarks examples
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        redis-py: ["redis>=6,<7", "redis>=8"]
    env:
      BLITZQ_TEST_REDIS_URL: redis://localhost:6379/15
      BLITZQ_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7.4-alpine \
            redis-server --enable-debug-command yes
          for i in $(seq 1 20); do
            docker exec redis redis-cli ping && break
            sleep 2
          done
      - run: pip install -e ".[dev]" "${{ matrix.redis-py }}"
      - run: pytest -q

  unit-windows:
    # No Redis service on Windows runners: Redis-marked tests are skipped.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel into a clean environment and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import blitzq, sys; print(blitzq.__version__); assert 'fastapi' not in sys.modules"
          /tmp/clean/bin/blitzq --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
