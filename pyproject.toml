[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "blitzq"
dynamic = ["version"]
description = "A high-performance, framework-agnostic asyncio task queue backed by Redis."
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "AiNest Labs" }]
keywords = ["task queue", "redis", "asyncio", "background jobs", "worker", "scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0",
    "msgspec>=0.18",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
django = ["django>=4.2"]
flask = ["flask>=2.3"]
monitoring = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5",
    "fastapi>=0.110",
    "httpx>=0.27",
    "django>=4.2",
    "flask>=2.3",
    "prometheus-client>=0.20",
    "pyyaml>=6",
]
bench = [
    "celery[redis]>=5.4",
    "huey[redis]>=2.5",
    "pyyaml>=6",
    "psutil>=5.9",
    "matplotlib>=3.8",
]

[project.scripts]
blitzq = "blitzq.cli:main"

[project.urls]
Homepage = "https://github.com/ainest-labs/BlitzQ"
Documentation = "https://github.com/ainest-labs/BlitzQ/tree/main/docs"
Changelog = "https://github.com/ainest-labs/BlitzQ/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/blitzq/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzq"]

[tool.hatch.build.targets.sdist]
include = ["src/blitzq", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "redis: requires a running Redis server (BLITZQ_TEST_REDIS_URL, default redis://localhost:6379/15)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PERF"]
ignore = ["RUF012", "B008", "SIM105", "PERF203", "UP046", "UP047", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC", "B", "PERF", "RUF006"]
"benchmarks/**" = ["ASYNC", "PERF", "E501"]
"examples/**" = ["ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/blitzq"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["django.*", "flask.*", "prometheus_client.*"]
ignore_missing_imports = true
